<!doctype html>
<html lang="zh-CN" class="codex-theme-studio-skin"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>镜面协议 · 主题样稿</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 'Microsoft YaHei UI',system-ui,sans-serif}button,input,textarea{font:inherit}button,a{cursor:pointer}button{color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--mp-accent);outline-offset:4px}a{text-decoration:none;color:inherit}.shell{display:flex;height:100vh;min-height:640px}.app-shell-left-panel{width:236px;flex:none;padding:28px 18px 20px;border-right:1px solid var(--mp-border);position:relative}.brand{display:flex;align-items:center;gap:10px;margin:0 8px 28px;letter-spacing:.09em;font-size:15px;font-weight:700}.brand-mark{width:34px;height:34px;background:var(--mp-mark) center/contain no-repeat}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--mp-accent);box-shadow:0 0 10px color-mix(in srgb,var(--mp-accent),transparent 50%)}.new-chat{width:100%;padding:10px 14px;border:1px solid var(--mp-border);border-radius:9px;background:var(--mp-panel);text-align:left}.section-label{color:var(--mp-muted);font-size:10px;letter-spacing:.15em;margin:30px 12px 12px}.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;margin:3px 0;color:var(--mp-muted)}.nav-item.active{background:color-mix(in srgb,var(--mp-accent),transparent 91%);color:var(--mp-ink)}.sidebar-footer{position:absolute;left:28px;bottom:28px;right:28px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--mp-muted)}.main-surface{position:relative;flex:1;min-width:0;overflow:auto}.appbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;color:var(--mp-muted);font-size:11px;letter-spacing:.08em;border-bottom:1px solid color-mix(in srgb,var(--mp-border),transparent 58%)}.bar-actions{display:flex;align-items:center;gap:12px}.icon-button{border:1px solid var(--mp-border);border-radius:7px;background:var(--mp-panel);padding:4px 10px;color:var(--mp-muted)}.workspace{position:relative;min-height:calc(100vh - 70px);padding:160px 0 100px 7.2%}.reading{width:min(620px,63%)}.eyebrow{display:flex;align-items:center;gap:10px;font:10px 'Cascadia Code',Consolas,monospace;letter-spacing:.16em;color:var(--mp-accent)}.tiny-rule{display:inline-block;width:34px;height:1px;background:var(--mp-accent)}h1{font-size:38px;line-height:1.4;letter-spacing:.035em;font-weight:450;margin:24px 0 15px;color:var(--mp-ink)}.subtitle{color:var(--mp-muted);font-size:12px;letter-spacing:.03em;margin-bottom:42px}.composer-surface-chrome{border:1px solid var(--mp-border);padding:20px 20px 14px;min-height:142px}.composer-surface-chrome textarea{display:block;width:100%;height:58px;resize:none;border:0;outline:0;background:transparent;color:var(--mp-ink);font-size:13px}.composer-toolbar{display:flex;align-items:center;justify-content:space-between}.tools{display:flex;gap:15px;align-items:center;color:var(--mp-muted);font-size:11px}.plain-button{border:0;background:transparent;padding:0;color:var(--mp-muted)}.send-button{width:30px;height:30px;border:0;border-radius:8px;background:var(--mp-accent);color:var(--cts-accent-ink);font-size:17px}.suggestions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.suggestion{border:1px solid color-mix(in srgb,var(--mp-border),transparent 24%);border-radius:10px;padding:14px 12px;text-align:left;background:color-mix(in srgb,var(--mp-panel),transparent 16%);color:var(--mp-muted);font-size:11px;backdrop-filter:blur(12px)}.suggestion b{font-weight:400;color:var(--mp-accent);margin-right:7px}.hero-caption{position:absolute;right:35px;top:94px;text-align:right;font-size:10px;letter-spacing:.18em;color:var(--mp-accent)}.hero-caption strong{display:block;font:10px/1.8 'Cascadia Code',Consolas,monospace;letter-spacing:.14em}.view-label{position:fixed;top:10px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mp-muted);letter-spacing:.1em;opacity:.6;pointer-events:none}.preview-controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;padding:7px;border:1px solid var(--mp-border);background:var(--mp-panel);color:var(--mp-ink);border-radius:14px;box-shadow:0 8px 32px #0002;z-index:100;white-space:nowrap}.preview-controls button{background:transparent;border:0;border-radius:8px;padding:7px 12px;font-size:11px}.preview-controls button[aria-pressed=true]{color:var(--mp-accent)}.preview-controls .separator{width:1px;height:20px;background:var(--mp-border);margin:0 4px}.preview-controls span.mode-label{padding:0 10px;font-size:10px;color:var(--mp-muted)}.markdown{padding:30px;border-radius:12px;background:var(--mp-panel);color:var(--mp-ink);border:1px solid var(--mp-border);margin:25px 0}.markdown h2{font-size:17px;margin:0 0 16px}.markdown p{font-size:13px}.markdown pre{padding:18px;border:1px solid var(--mp-border);border-radius:8px;overflow:auto;font:12px/1.8 'Cascadia Code',monospace}.diff-add{color:#24815b}.diff-remove{color:#cb5d6a}dialog{border:1px solid var(--mp-border);border-radius:16px;background:var(--mp-panel);color:var(--mp-ink);width:440px;padding:28px}dialog::backdrop{background:#0007;backdrop-filter:blur(5px)}dialog h2{font-size:19px}dialog p{color:var(--mp-muted)}dialog button{border:1px solid var(--mp-border);background:var(--mp-panel);border-radius:8px;padding:7px 20px}[role=menu]{position:absolute;right:30px;top:60px;padding:18px;z-index:12;border:1px solid var(--mp-border);border-radius:12px;box-shadow:0 12px 35px #0003}.red-only{display:none}html[data-mirror-mode=red] .red-only{display:initial}html[data-mirror-mode=red] .blue-only{display:none}html[data-mirror-mode=red] .diff-add{color:#80c6a0}html[data-mirror-mode=red] .diff-remove{color:#ff9bad}
@media(max-width:1000px){.app-shell-left-panel{width:200px}.workspace{padding:130px 30px 120px}.reading{width:100%}.hero-caption{display:none}.appbar{padding:0 24px}.preview-controls{max-width:98vw;overflow-x:auto}.preview-controls button{padding:7px 9px}.mode-label{display:none}.suggestions{gap:6px}h1{font-size:30px}}
@media(max-width:1000px){.preview-controls{flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);white-space:normal;overflow:visible}.workspace{padding-bottom:150px}.suggestions{grid-template-columns:repeat(3,minmax(0,1fr))}.suggestion{min-width:0}dialog{max-width:calc(100vw - 32px)}}
@media(max-width:760px){.app-shell-left-panel{width:180px;padding:22px 12px 18px}.brand{gap:6px;margin-left:4px;font-size:12px}.brand-mark{width:27px;height:27px}.nav-item{padding:10px 9px;font-size:12px}.workspace{padding:100px 22px 155px}.appbar{padding:0 18px}.suggestions{grid-template-columns:1fr}.suggestion{padding:9px 12px}.markdown{padding:18px}.preview-controls button{padding:6px 8px}}
.brand-mark{position:relative;flex:none;background-image:none!important}.brand-mark::before,.brand-mark::after{content:"";position:absolute;inset:0;background:var(--mp-blue-mark) center/contain no-repeat;transition:opacity .6s ease,transform 1.6s cubic-bezier(.22,.61,.36,1),filter .6s ease}.brand-mark::after{background-image:var(--mp-red-mark);opacity:0;transform:rotate(32deg) scale(.65);filter:blur(2px)}html[data-mirror-appearance=night] .brand-mark::before{background-image:var(--mp-night-mark)}html[data-mirror-mode=red] .brand-mark::before{opacity:0;transform:rotate(-32deg) scale(.65);filter:blur(2px)}html[data-mirror-mode=red] .brand-mark::after{opacity:1;transform:rotate(0) scale(1);filter:blur(0)}html[data-mirror-phase=breach] .brand-mark::before,html[data-mirror-phase=breach] .brand-mark::after{transition-delay:0s}@media(prefers-reduced-motion:reduce){.brand-mark::before,.brand-mark::after{transition:none!important}}
.status-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.status-row span{font-size:11px;line-height:1.8;padding:2px 9px;border-radius:5px}.composer-toolbar{border-radius:7px}
</style></head><body>
<div class="shell">
<aside class="app-shell-left-panel"><div class="brand"><div class="brand-mark" aria-hidden="true"></div><span>MIRROR</span><span class="status-dot"></span></div><button class="new-chat" onclick="previewNavigate('home')">＋　新对话</button><div class="section-label">工作空间</div><a href="#home" class="nav-item active" aria-current="page" onclick="previewNavigate('home');return false">◈　灵感工作台</a><a href="#task" class="nav-item" onclick="previewNavigate('task');return false">⌘　项目与代码</a><a href="#recent" class="nav-item" onclick="previewNavigate('task');return false">◷　最近的对话</a><div class="section-label">最近</div><a href="#design" class="nav-item" onclick="previewNavigate('task');return false">镜面协议 · 视觉设计</a><a href="#signal" class="nav-item" onclick="previewNavigate('task');return false">信号与回声</a><div class="sidebar-footer"><span>PERSONAL SPACE</span><button class="plain-button" onclick="document.querySelector('dialog').showModal()" aria-label="打开设置">⚙</button></div></aside>
<main class="main-surface"><header class="appbar"><span>个人空间　/　<span id="breadcrumb">新对话</span></span><div class="bar-actions"><span class="status-dot"></span><span class="blue-only">DEEPSEEK</span><span class="red-only">THE LONG MARCH</span><button class="icon-button" onclick="toggleMenu()" aria-label="打开菜单">⋯</button></div></header><div class="hero-caption"><strong class="blue-only">BLUE FREQUENCY / 01</strong><strong class="red-only">RED FREQUENCY / 02</strong><span class="blue-only">蓝鲸 · 镜面彼端</span><span class="red-only">长征 · 你看到的我</span></div><div class="workspace" role="main" id="workspace"></div></main></div>
<div class="view-label">交互设计样稿 · 非 Codex 实机截图</div>
<nav class="preview-controls" aria-label="样稿控制"><button data-choice="blue" onclick="choose('blue')">蓝白 DeepSeek</button><button data-choice="night" onclick="choose('night')">☾ DeepSeek 夜间</button><button data-choice="red" onclick="choose('red')">黑红长征</button><button data-choice="auto" onclick="choose('auto')" aria-pressed="true">随机入侵</button><span class="separator"></span><button onclick="previewNavigate('task')">对话 / 代码</button><button onclick="previewNavigate('home')">首页</button><span class="mode-label" id="modeLabel">蓝白频段</span></nav>
<dialog role="dialog"><h2>阅读与显示</h2><p>在首页展示人物主视觉，对话和代码区域加深底色，保持文字清晰。</p><p>随机入侵可随时切换为固定蓝白或固定黑红。</p><button onclick="this.closest('dialog').close()">完成</button></dialog>
<script>
window.previewNavigate=function(view){
 const work=document.querySelector('#workspace');
 document.querySelector('#breadcrumb').textContent=view==='home'?'新对话':'项目与代码';
 work.innerHTML=view==='home'?`
 <div class="reading">
  <div class="eyebrow"><span data-testid="home-icon" aria-hidden="true">◈</span><span class="tiny-rule"></span><span class="blue-only">DEEPSEEK / CONNECTION STABLE</span><span class="red-only">THE LONG MARCH / SIGNAL ACQUIRED</span></div>
  <h1><span class="blue-only">把灵感，交给蓝鲸。</span><span class="red-only">你看到的我。</span></h1>
  <p class="subtitle"><span class="blue-only">在安静的频段里，让想法慢慢成形。</span><span class="red-only">镜面之后，另一束信号已经抵达。</span></p>
  <section class="composer-surface-chrome"><textarea aria-label="消息输入框" placeholder="今天，想一起完成什么？"></textarea><div class="composer-toolbar"><div class="tools"><button class="plain-button" aria-label="添加附件">＋</button><button class="plain-button" onclick="toggleMenu()">选择项目　⌄</button><span>自动思考</span></div><button class="send-button" aria-label="发送消息" onclick="previewNavigate('task')">↑</button></div></section>
  <div class="suggestions"><button class="suggestion" onclick="previewNavigate('task')"><b>⌘</b>构建一个新想法</button><button class="suggestion" onclick="previewNavigate('task')"><b>⌁</b>梳理项目与代码</button><button class="suggestion" onclick="previewNavigate('task')"><b>✧</b>继续上一次灵感</button></div>
 </div>`:`
 <div class="reading">
  <div class="eyebrow"><span class="tiny-rule"></span>MIRROR / WORKSPACE</div><h1>让信号继续。</h1>
  <article class="markdown" data-testid="conversation-turn"><h2>项目预览</h2><p>工作区已准备好。继续完善你的项目，让下一束信号抵达。</p>
   <pre><span data-syntax="comment">// 让每一束信号，各归其位。</span>\n<span data-syntax="keyword">const</span> signal = {\n  source: <span data-syntax="string">"mirror"</span>,\n  channel: <span data-syntax="string">"connected"</span>,\n  frequency: <span data-syntax="number">87.4</span>\n};\n\n<span class="diff-remove">− render(noise);</span>\n<span class="diff-add">+ render(clarity);</span></pre>
   <div class="status-row" aria-label="状态配色样例"><span data-status="success">✓ 构建通过</span><span data-status="warning">◷ 等待确认</span><span data-status="error">! 连接异常</span></div>
  </article>
  <section class="composer-surface-chrome"><textarea aria-label="消息输入框" placeholder="继续补充你的想法…"></textarea><div class="composer-toolbar"><span class="tools">＋　项目上下文</span><button class="send-button" aria-label="发送消息">↑</button></div></section>
 </div>`;
 window.__CODEX_THEME_STUDIO_STATE__?.ensure?.();
};
window.toggleMenu=function(){let menu=document.querySelector('[role=menu]');if(menu){menu.remove();return;}menu=document.createElement('div');menu.setAttribute('role','menu');menu.innerHTML='<button class="plain-button" onclick="this.parentElement.remove();document.querySelector(\'dialog\').showModal()">阅读与显示</button>';document.querySelector('main').append(menu);};
window.previewNavigate('home');
</script>
<script type="module">
import {installMirrorProtocol,mirrorSchedule} from './runtime/scripts/mirror-protocol.mjs';
const {default:rendererReady}=await import('./preview-inject.js');
await rendererReady;
const config=await(await fetch('./mirror-config.json')).json();
installMirrorProtocol(config,mirrorSchedule);
window.choose=function(mode){document.activeElement?.blur();for(const b of document.querySelectorAll('[data-choice]'))b.setAttribute('aria-pressed',String(b.dataset.choice===mode));if(mode==='auto')window.__MIRROR_PROTOCOL__.resume();else window.__MIRROR_PROTOCOL__.choose(mode);};
window.refreshPreviewLabels=()=>{const state=window.__MIRROR_PROTOCOL__?.snapshot();if(!state)return;
 document.querySelector('#modeLabel').textContent=state.mode==='red'?'红色信号接入':state.appearance==='night'?'深蓝夜航':'蓝白频段';
 const selected=state.automatic?'auto':state.mode==='red'?'red':state.appearance==='night'?'night':'blue';for(const b of document.querySelectorAll('[data-choice]'))b.setAttribute('aria-pressed',String(b.dataset.choice===selected));
 const title=document.querySelector('h1 .blue-only');if(title)title.textContent=state.appearance==='night'?'夜深了，蓝鲸还在。':'把灵感，交给蓝鲸。';
 const sub=document.querySelector('.subtitle .blue-only');if(sub)sub.textContent=state.appearance==='night'?'在低光的深蓝频段里，安静续写你的想法。':'在安静的频段里，让想法慢慢成形。';
};
window.addEventListener('mirror-mode-change',refreshPreviewLabels);
document.addEventListener('click',()=>queueMicrotask(refreshPreviewLabels));
// Same trusted switcher as the portable runtime; only its manager transport is simulated here.
const switcher=await(await fetch('./runtime/assets/theme-switcher.js')).text();
await (0,eval)(switcher.replace('__CTS_CONTROL_JSON__',JSON.stringify({bridge:true})));
const previewTransport=setInterval(()=>{
 const bridge=window.__CODEX_THEME_STUDIO_SWITCHER_STATE__;if(!bridge)return;
 for(const req of bridge.drainRequests()){
  if(req.route==='themes')bridge.deliver(req.id,{activeTheme:'mirror-protocol-auto',themes:[{id:'mirror-protocol-auto',displayName:'镜面协议 · 自动频段',designedFor:'light'},{id:'deepseek-blue',displayName:'镜面协议 · DeepSeek',designedFor:'light'},{id:'deepseek-night',displayName:'镜面协议 · DeepSeek 夜间',designedFor:'dark'},{id:'longmarch-black',displayName:'镜面协议 · 长征',designedFor:'dark'}]});
  else if(req.route==='switch'){choose(req.body.theme==='mirror-protocol-auto'?'auto':req.body.theme==='longmarch-black'?'red':req.body.theme==='deepseek-night'?'night':'blue');bridge.deliver(req.id,{preview:true});}
  else bridge.deliver(req.id,null,'设计样稿：原生恢复与主题库在实际管理器中使用');
 }
},80);
window.stopPreviewTransport=()=>clearInterval(previewTransport);
const requested=new URLSearchParams(location.search).get('mode');if(['blue','night','red'].includes(requested))choose(requested);else refreshPreviewLabels();
window.previewReady=true;
</script></body></html>
<style>html:not([data-mirror-mode="red"]) .red-only{display:none!important}html[data-mirror-mode="red"] .blue-only{display:none!important}.hero-caption strong.red-only{display:block}.hero-caption span{display:block}</style>
<style>html[data-mirror-appearance="night"]:not([data-mirror-mode="red"]) .diff-add{color:#8ed6b3}html[data-mirror-appearance="night"]:not([data-mirror-mode="red"]) .diff-remove{color:#ff9bad}</style>
