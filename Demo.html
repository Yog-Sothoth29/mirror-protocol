<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>镜面协议 · 完整交互演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08101c;color:#dcecff;font:13px/1.6 system-ui,'Microsoft YaHei',sans-serif}header{min-height:100px;padding:15px 22px 12px;border-bottom:1px solid #334860}h1{font-size:18px;font-weight:500;margin:0 0 7px}h1 small{font-size:11px;color:#90a9c1;font-weight:400;margin-left:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{font:inherit}button{border:1px solid #3d5c79;background:#14273b;color:#dcecff;padding:6px 13px;border-radius:99px;cursor:pointer}button[aria-pressed=true]{background:#a4d6ff;color:#092137}button:focus-visible,a:focus-visible{outline:2px solid #b6e0ff;outline-offset:3px}a{color:#91cfff;text-underline-offset:3px}.panes{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;height:calc(100vh - 100px);min-height:650px}.pane{min-width:0;display:flex;flex-direction:column;border:1px solid #334860;border-radius:9px;overflow:hidden}.pane-title{height:29px;flex:none;background:#102034;padding:4px 12px;color:#b1c7de;font-size:11px}iframe{border:0;background:#081322;display:block;width:100%;flex:1;min-height:0}body[data-layout=single] .panes{grid-template-columns:1fr}body[data-layout=single] .pane:last-child{display:none}#status{font-size:11px;color:#91a9bf;margin-left:6px}@media(max-width:800px){header{padding:12px}h1 small{display:block;margin:0}.panes{padding:8px;gap:8px;height:calc(100vh - 142px)}.toolbar{gap:6px}button{padding:5px 10px}}
</style>
<body data-layout="split"><header><h1>镜面协议 · 完整交互演示 <small>2.3.1 · 快速入镜 / 定格 / 轮廓置换交接 · 独立浏览器样稿 · 3.6秒</small></h1><div class="toolbar"><button id="single" aria-pressed="false">单窗口</button><button id="split" aria-pressed="true">左右分屏</button><button id="play">演示破碎切换 · 3.6秒</button><button id="return">返回 DeepSeek</button><a href="docs/FRONTEND-STYLE-RESEARCH.md">配色对照 / 开源参考</a><a href="Transition.html">转场素材</a><a href="docs/media/wechat-article-poster.png">截图图库</a><span id="status">正在加载日间 / 夜间…</span></div></header>
<div class="panes"><section class="pane"><div class="pane-title">左侧窗口 · DeepSeek 日间 / 长征机</div><iframe title="左侧日间主题演示" src="index.html?mode=blue&demo=1"></iframe></section><section class="pane"><div class="pane-title">右侧窗口 · DeepSeek 夜间 / 长征机</div><iframe title="右侧夜间主题演示" src="index.html?mode=night&demo=1"></iframe></section></div>
<script>
const frames=[...document.querySelectorAll('iframe')],status=document.querySelector('#status');
function layout(name){document.body.dataset.layout=name;document.querySelector('#single').setAttribute('aria-pressed',name==='single');document.querySelector('#split').setAttribute('aria-pressed',name==='split');}
if(innerWidth<1200)layout('single');document.querySelector('#single').onclick=()=>layout('single');document.querySelector('#split').onclick=()=>layout('split');
function ready(){try{return frames.every(f=>f.contentWindow.previewReady);}catch{return false;}}
function reset(){frames.forEach((f,i)=>{const w=f.contentWindow;w.__MIRROR_PROTOCOL__.choose(i?'night':'blue');});}
document.querySelector('#play').onclick=async()=>{if(!ready())return;const button=document.querySelector('#play');button.disabled=true;const recovering=frames.some(f=>f.contentWindow.__MIRROR_PROTOCOL__.snapshot().mode==='red');reset();if(recovering)await new Promise(resolve=>setTimeout(resolve,1450));frames.forEach(f=>f.contentWindow.choose('red'));status.textContent='碎镜显现稍放慢，落镜短震，停顿后以少量条纹与轮廓置换交接长征机';setTimeout(()=>{button.disabled=false;status.textContent='3.6秒切换完成；可操作圆形按钮或再次演示';},4000);};
document.querySelector('#return').onclick=()=>{if(ready()){reset();status.textContent='返回各自的日间 / 夜间基底';}};
const poll=setInterval(()=>{if(ready()){clearInterval(poll);window.demoReady=true;status.textContent='可直接操作输入框、代码、菜单与圆形切换按钮';}},120);
if(location.protocol==='file:')status.textContent='完整交互需先运行 Preview.cmd，再打开本机 Demo.html';
</script></body></html>
